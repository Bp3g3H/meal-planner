<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="page">
    <h2>My profile</h2>

    <div th:if="${updated}" class="success-text">
        Profile updated.
    </div>

    <form th:action="@{/profile}" th:object="${profileUpdateDto}" method="post">
        <label for="username">Username</label>
        <input type="text" id="username" th:value="${username}">
        <div th:errors="*{username}" class="error-text"></div>

        <label for="email">Email</label>
        <input type="email" id="email" th:field="*{email}" disabled>

        <button type="submit">Save changes</button>
    </form>
</main>

</body>
</html>
