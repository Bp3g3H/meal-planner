<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — MealPlanner</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar(activePage='profile')}"></div>

<main>
    <header class="page-header">
        <h1>My Profile</h1>
        <p>Manage your account details.</p>
    </header>



    <div class="form-card">
        <div class="success-banner" th:if="${updated}">
            <p>Profile updated.</p>
        </div>
        <form th:action="@{/profile}" th:object="${profileUpdateDto}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" th:field="*{username}" />
                <p class="field-error" th:errors="*{username}"></p>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" disabled />
                <input type="hidden" th:field="*{email}">
            </div>

            <button type="submit" class="btn btn--primary" style="width: 100%;">Save Changes</button>
        </form>
    </div>
</main>

<footer class="footer">
    <p>&copy; 2026 MealPlanner. Personal Meal Planner &amp; Food Diary.</p>
</footer>

</body>
</html>
