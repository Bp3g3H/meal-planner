<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
<body>
<nav th:fragment="navbar" class="navbar">
  <div class="navbar__inner">
    <a th:href="@{/}" class="navbar__brand">
      <span class="navbar__logo" aria-hidden="true">🍽</span>
      MealPlanner
    </a>
    <ul class="navbar__links">
        <li>
            <a th:href="@{/}">Home</a>
        </li>
        <li>
            <a th:href="@{/dishes}">Dish Catalog</a>
        </li>
        <li sec:authorize="isAuthenticated()">
            <a th:href="@{/meals/log}">Log Meal</a>
        </li>
        <li sec:authorize="isAuthenticated()">
            <a th:href="@{/meals/diary}">My Diary</a>
        </li>
        <li sec:authorize="isAuthenticated()">
            <a th:href="@{/group}">Group</a>
        </li>
        <li sec:authorize="isAuthenticated()">
            <a th:href="@{/nutrition-goal}">Nutrition Goal</a>
        </li>
        <li sec:authorize="isAuthenticated()">
            <a th:href="@{/nutrition-insights}">Nutrition Insights</a>
        </li>
        <li sec:authorize="hasAuthority('ADMIN')">
            <a th:href="@{/admin/dishes}">Dishes (Admin)</a>
        </li>
        <li sec:authorize="hasRole('ADMIN')">
            <a  th:href="@{/admin/users}">Manage Users (Admin)</a>
        </li>
        <li sec:authorize="isAuthenticated()">
            <a th:href="@{/profile}">Profile</a>
        </li>
        <li sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}">Login</a>
        </li>
        <li sec:authorize="!isAuthenticated()">
            <a th:href="@{/register}">Register</a>
        </li>
        <li sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="get" class="navbar__logout-form">
              <button type="submit" class="navbar__logout-btn">Logout</button>
            </form>
        </li>
    </ul>
  </div>
</nav>
</body>
</html>
