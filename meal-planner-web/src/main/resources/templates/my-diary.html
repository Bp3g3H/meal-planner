<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Diary — MealPlanner</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>
    <header class="page-header">
        <h1>My Food Diary</h1>
        <p th:if="${!group.dummy}">
            Shared meals for group <strong th:text="${group.name}"></strong>.
        </p>
        <p th:if="${group.dummy}">
            Logged meals for <strong th:text="${username}"></strong> — set up a group to share your diary.
        </p>
    </header>

    <p th:if="${mealLogs.isEmpty()}" class="prototype-note">
        No meals logged yet. <a th:href="@{/meals/log}">Log your first meal</a>.
    </p>

    <section class="diary-date-group" th:each="dateEntry : ${mealLogsByDate}">
        <h2 th:text="${#temporals.format(dateEntry.key, 'EEEE, MMMM d, yyyy')}"></h2>
        <div class="diary-entries">
            <article class="diary-entry" th:each="entry : ${dateEntry.value}">
                <div class="diary-entry__main">
                    <h3 th:text="${entry.dishName}"></h3>
                    <div class="diary-entry__meta">
              <span class="badge"
                    th:text="${entry.mealType}"
                    th:classappend="' badge--' + ${#strings.toLowerCase(entry.mealType)}"></span>
                        <span>Portion: <strong th:text="${entry.portionSize}"></strong></span>
                        <span>Calories: <strong th:text="${entry.dishCalories * entry.portionSize.multiplier} + ' kcal'"></strong></span>
                        <span class="entry-author" th:text="'by ' + ${entry.username}"></span>
                    </div>
                </div>
                <div class="diary-entry__actions" th:if="${entry.userId == currentUserId}">
                    <div class="btn-group">
                        <a th:href="@{/meals/{id}/edit(id=${entry.id})}"
                           class="btn btn--outline btn--sm">Edit</a>
                        <form th:action="@{/meals/delete/{id}(id=${entry.id})}"
                              method="post"
                              onsubmit="return confirm('Delete this meal log?')">
                            <button type="submit" class="btn btn--danger btn--sm">Delete</button>
                        </form>
                    </div>
                </div>
                <p class="diary-entry__notes"
                   th:if="${entry.notes != null and !entry.notes.isEmpty()}"
                   th:text="${entry.notes}"></p>
            </article>
        </div>
    </section>
</main>

<footer class="footer">
    <p>&copy; 2026 MealPlanner. Personal Meal Planner &amp; Food Diary.</p>
</footer>
</body>
</html>
