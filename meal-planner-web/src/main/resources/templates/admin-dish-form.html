<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Dish — MealPlanner</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>
    <div class="form-card form-card--wide">
        <h1>Add New Dish</h1>
        <p class="subtitle">Create a new dish and add it to the catalog.</p>

        <form th:action="@{/admin/dishes/add}" th:object="${dishFormRequest}" method="post">
            <div class="form-group">
                <label for="name">Dish Name</label>
                <input type="text" id="name" th:field="*{name}" placeholder="e.g. Greek Yogurt Parfait">
                <div th:errors="*{name}" class="error-text"></div>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" th:field="*{category}">
                    <option value="">— Select category —</option>
                    <option th:each="cat : ${dishCategories}"
                            th:value="${cat}" th:text="${cat}"></option>
                </select>
                <div th:errors="*{category}" class="error-text"></div>
            </div>

            <div class="form-group">
                <label for="calories">Calories (Medium Portion)</label>
                <input type="number" id="calories" th:field="*{calories}" placeholder="e.g. 350" min="0">
                <div th:errors="*{calories}" class="error-text"></div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}"
                          placeholder="Short description of the dish…"></textarea>
                <div th:errors="*{description}" class="error-text"></div>
            </div>

            <div class="form-group">
                <label for="imageUrl">Image URL <span style="font-weight: 400; color: var(--color-text-muted);">(optional)</span></label>
                <input type="text" id="imageUrl" th:field="*{imageUrl}" placeholder="https://…">
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn--primary">Save Dish</button>
                <a th:href="@{/admin/dishes}" class="btn btn--outline">Cancel</a>
            </div>
        </form>
    </div>
</main>

<footer class="footer">
    <p>&copy; 2026 MealPlanner. Personal Meal Planner &amp; Food Diary.</p>
</footer>
</body>
</html>
