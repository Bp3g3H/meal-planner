<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Manage Dishes — MealPlanner</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>
    <header class="page-header">
        <h1>Manage Dishes</h1>
        <p>Admin panel — view, edit, and delete dishes in the catalog.</p>
    </header>

    <div class="admin-toolbar">
        <p style="margin: 0; color: var(--color-text-muted);"
           th:text="${dishes.size()} + ' dishes in catalog'"></p>
        <a th:href="@{/admin/dishes/add}" class="btn btn--primary">Add New Dish</a>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Calories (Medium)</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="dish : ${dishes}">
                <td th:text="${#strings.abbreviate(dish.id.toString(), 8, 0)}"></td>
                <td th:text="${dish.name}"></td>
                <td>
              <span class="badge"
                    th:text="${dish.category}"
                    th:classappend="' badge--' + ${#strings.toLowerCase(dish.category)}"></span>
                </td>
                <td th:text="${dish.calories} + ' kcal'"></td>
                <td th:text="${dish.description}"></td>
                <td>
                    <div class="btn-group">
                        <a th:href="@{/admin/dishes/edit/{id}(id=${dish.id})}"
                           class="btn btn--outline btn--sm">Edit</a>
                        <form th:action="@{/admin/dishes/delete/{id}(id=${dish.id})}"
                              method="post"
                              onsubmit="return confirm('Delete this dish?')">
                            <button type="submit" class="btn btn--danger btn--sm">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

<footer class="footer">
    <p>&copy; 2026 MealPlanner. Personal Meal Planner &amp; Food Diary.</p>
</footer>
</body>
</html>
