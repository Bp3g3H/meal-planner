<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dish Catalog — MealPlanner</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main>
    <header class="page-header">
      <h1>Dish Catalog</h1>
      <p>Browse our collection of meals and snacks to add to your food diary.</p>
    </header>

    <div class="dish-grid" th:if="${!dishes.isEmpty()}">
      <article class="dish-card" th:each="dish : ${dishes}">
        <div class="dish-card__image" th:if="${dish.imageUrl == null or dish.imageUrl.isEmpty()}"
             aria-hidden="true">🍽</div>
        <img th:if="${dish.imageUrl != null and !dish.imageUrl.isEmpty()}"
             th:src="${dish.imageUrl}" th:alt="${dish.name}" class="dish-card__image">
        <div class="dish-card__body">
          <div class="dish-card__header">
            <h2 class="dish-card__title" th:text="${dish.name}"></h2>
            <span class="badge"
                  th:text="${dish.category}"
                  th:classappend="' badge--' + ${#strings.toLowerCase(dish.category)}"></span>
          </div>
          <p class="dish-card__calories">
            <strong th:text="${dish.calories} + ' kcal'"></strong> per medium serving
          </p>
          <p class="dish-card__description" th:text="${dish.description}"></p>
        </div>
      </article>
    </div>

    <p th:if="${dishes.isEmpty()}" class="prototype-note">
      No dishes in the catalog yet.
      <span th:if="${isAdmin}">
        <a th:href="@{/admin/dishes/add}">Add the first dish</a>.
      </span>
    </p>
  </main>

  <footer class="footer">
    <p>&copy; 2026 MealPlanner. Personal Meal Planner &amp; Food Diary.</p>
  </footer>
</body>
</html>
