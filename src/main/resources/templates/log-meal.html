<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Meal — MealPlanner</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>
    <div class="form-card form-card--wide">
        <h1>Log a Meal</h1>
        <p class="subtitle">Record what you ate and add it to your food diary.</p>

        <form th:action="@{/meals/log}" th:object="${mealLogFormRequest}" method="post">
            <div class="form-group">
                <label for="dishId">Dish</label>
                <select id="dishId" th:field="*{dishId}">
                    <option value="">— Select a dish —</option>
                    <option th:each="dish : ${dishes}"
                            th:value="${dish.id}"
                            th:text="${dish.name} + ' (' + ${dish.calories} + ' kcal)'"></option>
                </select>
                <div th:errors="*{dishId}" class="error-text"></div>
            </div>

            <div class="form-group">
                <label for="mealType">Meal Type</label>
                <select id="mealType" th:field="*{mealType}">
                    <option value="">— Select meal type —</option>
                    <option th:each="type : ${mealTypes}"
                            th:value="${type}" th:text="${type}"></option>
                </select>
                <div th:errors="*{mealType}" class="error-text"></div>
            </div>

            <div class="form-group">
                <label for="loggedAt">Date</label>
                <input type="date" id="loggedAt" th:field="*{loggedAt}">
                <div th:errors="*{loggedAt}" class="error-text"></div>
            </div>

            <div class="form-group">
                <label for="portionSize">Portion Size</label>
                <select id="portionSize" th:field="*{portionSize}">
                    <option value="">— Select portion —</option>
                    <option th:each="size : ${mealPortionSizes}"
                            th:value="${size}" th:text="${size}"></option>
                </select>
                <p class="hint">Calories are adjusted based on portion size.</p>
                <div th:errors="*{portionSize}" class="error-text"></div>
            </div>

            <div class="form-group">
                <label for="notes">Notes <span style="font-weight: 400; color: var(--color-text-muted);">(optional)</span></label>
                <textarea id="notes" th:field="*{notes}"
                          placeholder="e.g. Added extra honey, ate at the office cafeteria…"></textarea>
                <div th:errors="*{notes}" class="error-text"></div>
            </div>

            <button type="submit" class="btn btn--primary" style="width: 100%;">Log Meal</button>
        </form>
    </div>
</main>

<footer class="footer">
    <p>&copy; 2026 MealPlanner. Personal Meal Planner &amp; Food Diary.</p>
</footer>
</body>
</html>
