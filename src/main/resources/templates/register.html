<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — MealPlanner</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>
    <div class="form-card form-card--wide">
        <h1>Create an Account</h1>
        <p class="subtitle">Join MealPlanner and start tracking your meals today.</p>

        <div th:if="${error}" class="error-text" th:text="${error}" role="alert"></div>

        <form th:action="@{/register}" th:object="${registerDto}" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" th:field="*{username}" placeholder="johndoe">
                <div th:errors="*{username}" class="error-text"></div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" placeholder="john@example.com">
                <div th:errors="*{email}" class="error-text"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Enter password">
                <div th:errors="*{password}" class="error-text"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                       placeholder="Re-enter password">
                <div th:errors="*{confirmPassword}" class="error-text"></div>
            </div>

            <fieldset class="form-fieldset">
                <legend>Group</legend>

                <label class="radio-label">
                    <input type="radio" th:field="*{groupChoice}" value="CREATE">
                    Create a new group
                </label>
                <label class="radio-label">
                    <input type="radio" th:field="*{groupChoice}" value="JOIN">
                    Join an existing group
                </label>
                <label class="radio-label">
                    <input type="radio" th:field="*{groupChoice}" value="NONE">
                    Continue without (you can set this up later)
                </label>
                <div th:errors="*{groupChoice}" class="error-text"></div>
            </fieldset>

            <div class="form-group" id="group-name-field">
                <label for="groupName">Group Name</label>
                <input type="text" id="groupName" th:field="*{groupName}"
                       placeholder="e.g. Smith Family Meals">
                <div th:errors="*{groupName}" class="error-text"></div>
            </div>

            <div class="form-group" id="group-password-field">
                <label for="groupPassword">Group Password</label>
                <input type="text" id="groupPassword" th:field="*{groupPassword}"
                       placeholder="Leave blank for a public group">
                <p class="hint" id="group-password-hint">Optional — leave blank to create a public group.</p>
                <div th:errors="*{groupPassword}" class="error-text"></div>
            </div>

            <button type="submit" class="btn btn--primary" style="width: 100%;">Register</button>
        </form>

        <p class="form-footer">
            Already have an account? <a th:href="@{/login}">Login here</a>
        </p>
    </div>
</main>

<footer class="footer">
    <p>&copy; 2026 MealPlanner. Personal Meal Planner &amp; Food Diary.</p>
</footer>

<script>
    const groupPasswordInput = document.getElementById('groupPassword');
    const groupPasswordHint = document.getElementById('group-password-hint');

    document.querySelectorAll('input[name="groupChoice"]').forEach((radio) => {
        radio.addEventListener('change', updateGroupFields);
    });

    function updateGroupFields() {
        const choice = document.querySelector('input[name="groupChoice"]:checked').value;
        const showName = choice !== 'NONE';
        const showPassword = choice === 'JOIN' || choice === 'CREATE';

        document.getElementById('group-name-field').style.display = showName ? 'block' : 'none';
        document.getElementById('group-password-field').style.display = showPassword ? 'block' : 'none';

        if (choice === 'JOIN') {
            groupPasswordInput.placeholder = 'Group password (required for private groups)';
            groupPasswordHint.textContent = 'Required if the group is private.';
        } else if (choice === 'CREATE') {
            groupPasswordInput.placeholder = 'Leave blank for a public group';
            groupPasswordHint.textContent = 'Optional — leave blank to create a public group.';
        }
    }

    updateGroupFields();
</script>
</body>
</html>
