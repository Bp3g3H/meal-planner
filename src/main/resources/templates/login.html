<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — MealPlanner</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar__inner">
      <a href="home" class="navbar__brand">
        <span class="navbar__logo" aria-hidden="true">🍽</span>
        MealPlanner
      </a>
      <ul class="navbar__links">
        <li><a href="home">Home</a></li>
        <li><a href="dish-catalog">Dish Catalog</a></li>
        <li><a href="log-meal">Log Meal</a></li>
        <li><a href="my-diary">My Diary</a></li>
        <li><a href="group-settings">Group</a></li>
        <li><a href="admin-dishes">Admin</a></li>
        <li><a href="login" class="active">Login</a></li>
        <li><a href="register">Register</a></li>
      </ul>
    </div>
  </nav>

  <main>
    <div class="form-card">
      <h1>Login</h1>
      <p class="subtitle">Welcome back! Sign in to your MealPlanner account.</p>

      <form action="#" method="post">
        <div class="form-group">
          <label for="username-email">Username or Email</label>
          <input
            type="text"
            id="username-email"
            name="username-email"
            placeholder="johndoe or john@example.com"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn--primary" style="width: 100%;">Login</button>
      </form>

      <p class="form-footer">
        Don't have an account? <a href="register">Register here</a>
      </p>
    </div>
  </main>

  <footer class="footer">
    <p>&copy; 2026 MealPlanner. Personal Meal Planner &amp; Food Diary.</p>
  </footer>
</body>
</html>
