<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — MealPlanner</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main>
    <div class="form-card">
        <h1>Login</h1>
        <p class="subtitle">Welcome back! Sign in to your MealPlanner account.</p>

        <div th:if="${error}" class="error-text" th:text="${error}" role="alert"></div>
        <div th:if="${param.logout}" class="success-text" role="status">
            You have been logged out successfully.
        </div>

        <form th:action="@{/login}" th:object="${loginDto}" method="post">
            <p class="error-text" th:if="${loginError}" th:text="${loginError}"></p>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" placeholder="john@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" th:field="*{password}" placeholder="Enter password">
            </div>

            <button type="submit" class="btn btn--primary" style="width: 100%;">Login</button>
        </form>

        <p class="form-footer">
            Don't have an account? <a th:href="@{/register}">Register here</a>
        </p>
    </div>
</main>

<footer class="footer">
    <p>&copy; 2026 MealPlanner. Personal Meal Planner &amp; Food Diary.</p>
</footer>
</body>
</html>
